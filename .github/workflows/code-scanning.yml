name: ScopeTrace Code Scanning
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Generate SARIF and capture permission gate
        id: scan
        shell: bash
        run: |
          set +e
          node dist/cli/main.js scan --config .github/scopetrace.config.json --format sarif --output "$RUNNER_TEMP/scopetrace.sarif" --fail-on high
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/scopetrace.sarif
          category: scopetrace/self/github-oauth
          wait-for-processing: true
      - name: Enforce permission gate
        if: always() && steps.scan.outputs.exit_code == '1'
        run: exit 1
