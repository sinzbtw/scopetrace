name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run smoke
      - name: Built CLI report and gate
        shell: bash
        working-directory: tests/fixtures/basic
        run: |
          node ../../../dist/cli/main.js scan --format json --output ../../../work-ci-report.json
          node -e "const r=require('../../../work-ci-report.json'); if(r.schemaVersion!=='1.0.0'||r.operations.length!==3) process.exit(1)"
          set +e
          node ../../../dist/cli/main.js scan --fail-on high
          code=$?
          set -e
          test "$code" -eq 1

      - name: Built GitHub App report and gate
        shell: bash
        working-directory: tests/fixtures/github-app
        run: |
          node ../../../dist/cli/main.js scan --format json --output ../../../work-ci-app-report.json
          node -e "const r=require('../../../work-ci-app-report.json'); if(r.provider!=='github-app'||r.schemaVersion!=='2.0.0'||r.operations.length!==2) process.exit(1)"
          set +e
          node ../../../dist/cli/main.js scan --fail-on high
          code=$?
          set -e
          test "$code" -eq 1

      - name: Built Google OAuth report and gate
        shell: bash
        working-directory: tests/fixtures/google-oauth
        run: |
          node ../../../dist/cli/main.js scan --format json --output ../../../work-ci-google-report.json
          node -e "const r=require('../../../work-ci-google-report.json'); if(r.provider!=='google-oauth'||r.schemaVersion!=='3.0.0'||r.operations.length!==3) process.exit(1)"
          set +e
          node ../../../dist/cli/main.js scan --fail-on high
          code=$?
          set -e
          test "$code" -eq 1

      - name: Built SARIF exports and gates
        shell: bash
        run: |
          for fixture in basic github-app google-oauth; do
            cd "$GITHUB_WORKSPACE/tests/fixtures/$fixture"
            set +e
            node ../../../dist/cli/main.js scan --format sarif --output "$GITHUB_WORKSPACE/work-ci-$fixture.sarif" --fail-on high
            code=$?
            set -e
            test "$code" -eq 1
            node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.version!=="2.1.0"||!r.runs[0].results.some(x=>x.properties.category==="insufficient"))process.exit(1)' "$GITHUB_WORKSPACE/work-ci-$fixture.sarif"
          done

      - name: Built committed permission comparison
        shell: bash
        run: |
          node dist/cli/main.js compare --base HEAD --head HEAD --config .github/scopetrace.config.json --format json --output work-ci-comparison.json --fail-on medium --fail-on-unknown
          node -e 'const r=require("./work-ci-comparison.json");if(r.kind!=="permission-diff"||r.schemaVersion!=="1.0.0"||r.changes.length||!r.analysis.complete)process.exit(1)'
