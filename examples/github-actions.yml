# Copy into your application's .github/workflows.
# Pinned to a reviewed implementation commit; update only after review.
name: OAuth scope review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sinzbtw/scopetrace
          ref: ab5df0b01b7a3d57d201337eb688f1321e02ff94
          path: tool
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: tool
      - run: npm run build
        working-directory: tool
      - run: node ../tool/dist/cli/main.js scan --fail-on high
        working-directory: app
